[package]
name = "vleer_api"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sqlx = { version = "0.9.0", features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "uuid",
  "time",
  "migrate",
] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
time = { version = "0.3.55", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenvy = "0.15.7"
validator = { version = "0.21.0", features = ["derive"] }
regex = "1.13.1"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
tower_governor = "0.8.0"
governor = "0.10.4"
anyhow = "1.0.104"
chrono = "0.4.45"
futures = "0.3.34"
reqwest = { version = "0.13.5", features = ["json", "form"] }
indicatif = "0.18.6"
manticoresearch = "2.2.0"
strsim = "0.11.1"
